name: Android AAB

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-aab.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build AAB (local, production profile)
        run: eas build --platform android --profile production --local --non-interactive --output ${{ github.workspace }}/mako-${{ github.sha }}.aab

      - uses: actions/upload-artifact@v4
        with:
          name: mako-aab-${{ github.sha }}
          path: ${{ github.workspace }}/mako-${{ github.sha }}.aab
          retention-days: 30
